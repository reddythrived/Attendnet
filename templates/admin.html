<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | AttendNet</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: white;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        h1 { font-size: 2rem; font-weight: 700; }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
        }

        .stat-label { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 8px; }
        .stat-value { font-size: 1.5rem; font-weight: 700; }

        .table-container {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            padding: 16px 24px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            padding: 16px 24px;
            border-bottom: 1px solid var(--glass-border);
            font-size: 0.95rem;
        }

        tr:last-child td { border-bottom: none; }

        .status-pill {
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .status-present {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-absent {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>Admin Dashboard</h1>
                <p style="color: var(--text-dim); font-size: 0.85rem; margin-top: 4px;">AttendNet AI System &bull; Live Attendance Monitor</p>
            </div>
            <div class="actions">
                <a href="/teacher/dashboard" class="btn btn-outline">👨‍🏫 Teacher Portal</a>
                <a href="/api/admin/export" class="btn btn-outline">📂 Export to Excel</a>
                <a href="/recognition" class="btn">📹 Start AI Recognition</a>
                <a href="/logout" class="btn" style="background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3);">Sign Out</a>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Registered Students</div>
                <div class="stat-value" id="studentCount">...</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Check-ins Today</div>
                <div class="stat-value" style="color: #34d399;" id="todayCheckins">...</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Absent Today</div>
                <div class="stat-value" style="color: #f87171;" id="absentCount">...</div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>USN</th>
                        <th>Status (Today)</th>
                        <th>Check-in Time</th>
                    </tr>
                </thead>
                <tbody id="attendanceTable">
                    <tr><td colspan="4" style="text-align: center; color: var(--text-dim); padding: 30px;">Loading dashboard data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadDashboardData() {
            try {
                const res = await fetch('/api/admin/stats');
                const data = await res.json();
                
                if (!data.success) {
                    document.getElementById('studentCount').innerText = "Error";
                    document.getElementById('todayCheckins').innerText = "Error";
                    return;
                }

                const students = data.students || [];
                const registeredCount = data.registered_count || students.length;
                const checkinsToday = data.today_checkins || 0;
                const absentToday = Math.max(0, registeredCount - checkinsToday);

                document.getElementById('studentCount').innerText = registeredCount;
                document.getElementById('todayCheckins').innerText = checkinsToday;
                document.getElementById('absentCount').innerText = absentToday;
                
                // Populate table
                const table = document.getElementById('attendanceTable');
                if (students.length === 0) {
                    table.innerHTML = '<tr><td colspan="4" style="text-align:center; color: #94a3b8; padding: 40px;">No students registered yet. Click "Start AI Recognition" or use the registration portal.</td></tr>';
                } else {
                    table.innerHTML = students.map(s => {
                        const isPresent = s.status === 'Present';
                        const badgeClass = isPresent ? 'status-present' : 'status-absent';
                        const badgeText = isPresent ? '● Present' : '○ Absent';
                        const timeStr = s.marked_at ? (new Date(s.marked_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })) : '—';
                        return `
                            <tr>
                                <td><strong>${s.name}</strong></td>
                                <td>${s.usn}</td>
                                <td><span class="status-pill ${badgeClass}">${badgeText}</span></td>
                                <td style="color: var(--text-dim); font-size: 0.85rem;">${timeStr}</td>
                            </tr>
                        `;
                    }).join('');
                }
            } catch (err) {
                console.error("Dashboard Load Error:", err);
                document.getElementById('studentCount').innerText = "Connection Error";
                document.getElementById('todayCheckins').innerText = "Offline";
            }
        }
        
        loadDashboardData();
        // Auto-refresh every 15 seconds while open
        setInterval(loadDashboardData, 15000);
    </script>
</body>
</html>
